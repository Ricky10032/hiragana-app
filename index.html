<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kana Practice for Clara 🌸</title>

    <!-- iPhoneホーム画面追加用の設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Kana 🌸">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23ffe6eb%22/><text y=%22.9em%22 font-size=%2280%22>🌸</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(180deg, #ffe6eb 0%, #fff0f3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            overflow-x: hidden;
        }

        h1 {
            color: #ff4d6d;
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            color: #ff758f;
            font-size: 0.95rem;
            margin-bottom: 15px;
            text-align: center;
        }

        /* ひらがな/カタカナ & Easy/Hard 切替エリア */
        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .toggle-group {
            display: flex;
            gap: 10px;
        }

        .mode-btn {
            border: 2px solid #ff758f;
            background: white;
            padding: 6px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #ff758f;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: #ff758f;
            color: white;
        }

        .script-btn {
            border: 2px solid #ff4d6d;
            background: white;
            padding: 6px 18px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #ff4d6d;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .script-btn.active {
            background: #ff4d6d;
            color: white;
        }

        /* タブ切替（3つに増量！） */
        .tab-container {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            background: white;
            padding: 5px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.15);
        }

        .tab-btn {
            border: none;
            background: transparent;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #ff758f;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #ff4d6d;
            color: white;
        }

        .content-card {
            background: white;
            width: 100%;
            max-width: 380px;
            border-radius: 25px;
            padding: 25px 15px;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* フラッシュカード */
        .flashcard-wrapper {
            perspective: 1000px;
            width: 220px;
            height: 220px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid #ffccd5;
            background: #fff5f7;
        }

        .card-front .char {
            font-size: 4.5rem;
            color: #ff4d6d;
            font-weight: bold;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #ff4d6d;
            color: white;
            border-color: #ff4d6d;
        }

        .card-back .romaji {
            font-size: 3rem;
            font-weight: bold;
        }

        .card-nav {
            display: flex;
            gap: 15px;
            align-items: center;
            width: 100%;
            justify-content: center;
        }

        .nav-btn {
            background: #ff758f;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.1s ease;
        }

        .nav-btn:active {
            transform: scale(0.9);
        }

        /* クイズ部分 */
        .quiz-char {
            font-size: 4.5rem;
            color: #ff4d6d;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .option-btn {
            background: #fff5f7;
            border: 2px solid #ffccd5;
            color: #ff4d6d;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:active {
            transform: scale(0.92);
        }

        .score-board {
            margin-top: 15px;
            font-size: 0.95rem;
            color: #ff758f;
            font-weight: bold;
        }

        /* 一覧表（Chart）用スタイル */
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 100%;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .chart-item {
            background: #fff5f7;
            border: 1.5px solid #ffccd5;
            border-radius: 12px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .chart-item:active {
            background: #ffe6eb;
        }

        .chart-main {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff4d6d;
        }

        .chart-sub {
            font-size: 0.75rem;
            color: #ff758f;
            margin-top: 2px;
        }

        /* ⭕️❌ オーバーレイ */
        .feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }

        .feedback-overlay.show {
            opacity: 1;
            transform: scale(1);
        }

        .feedback-correct {
            background: rgba(255, 230, 235, 0.92);
            color: #ff2a55;
        }

        .feedback-wrong {
            background: rgba(240, 240, 240, 0.92);
            color: #888;
        }

        .feedback-symbol {
            font-size: 6rem;
            font-weight: bold;
            line-height: 1;
        }

        .feedback-text {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <h1>Japanese Kana for Clara 🌸</h1>
    <div class="subtitle">Learn & Test with Ryuji 🖤</div>

    <div class="controls-container">
        <div class="toggle-group">
            <button class="script-btn active" id="hiraganaBtn">Hiragana</button>
            <button class="script-btn" id="katakanaBtn">Katakana</button>
        </div>
        <div class="toggle-group">
            <button class="mode-btn active" id="easyModeBtn">Easy Mode</button>
            <button class="mode-btn" id="hardModeBtn">Hard Mode</button>
        </div>
    </div>

    <!-- タブに「Chart 📊」を追加 -->
    <div class="tab-container">
        <button class="tab-btn active" id="cardTabBtn">Flashcards 🎴</button>
        <button class="tab-btn" id="quizTabBtn">Quiz Mode ✏️</button>
        <button class="tab-btn" id="chartTabBtn">Kana Chart 📊</button>
    </div>

    <!-- 1. フラッシュカード画面 -->
    <div id="cardSection" class="content-card">
        <div class="flashcard-wrapper" id="cardWrapper">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="char" id="cardChar">あ</div>
                    <span style="font-size: 0.8rem; color: #ff758f; margin-top: 10px;">Tap to flip 🔄</span>
                </div>
                <div class="card-face card-back">
                    <div class="romaji" id="cardRomaji">a</div>
                </div>
            </div>
        </div>
        <div class="card-nav">
            <button class="nav-btn" id="prevCardBtn">❮</button>
            <span id="cardCounter" style="color: #ff758f; font-weight: bold;">1 / 46</span>
            <button class="nav-btn" id="nextCardBtn">❯</button>
        </div>
    </div>

    <!-- 2. クイズ画面 -->
    <div id="quizSection" class="content-card hidden">
        <div class="quiz-char" id="quizChar">あ</div>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="score-board" id="scoreBoard">Score: 0 / 10</div>

        <div id="feedbackOverlay" class="feedback-overlay">
            <div class="feedback-symbol" id="feedbackSymbol">⭕️</div>
            <div class="feedback-text" id="feedbackText">Great!</div>
        </div>
    </div>

    <!-- 3. Kana Chart 一覧表画面 -->
    <div id="chartSection" class="content-card hidden">
        <div class="chart-grid" id="chartGrid"></div>
        <div style="font-size: 0.8rem; color: #ff758f; margin-top: 10px;">Tap any character to listen! 🔊</div>
    </div>

    <script>
        const hEasy = [
            { kana: 'あ', romaji: 'a', kata: 'ア' }, { kana: 'い', romaji: 'i', kata: 'イ' }, { kana: 'う', romaji: 'u', kata: 'ウ' }, { kana: 'え', romaji: 'e', kata: 'エ' }, { kana: 'お', romaji: 'o', kata: 'オ' },
            { kana: 'か', romaji: 'ka', kata: 'カ' }, { kana: 'き', romaji: 'ki', kata: 'キ' }, { kana: 'く', romaji: 'ku', kata: 'ク' }, { kana: 'け', romaji: 'ke', kata: 'ケ' }, { kana: 'こ', romaji: 'ko', kata: 'コ' },
            { kana: 'さ', romaji: 'sa', kata: 'サ' }, { kana: 'し', romaji: 'shi', kata: 'シ' }, { kana: 'す', romaji: 'su', kata: 'ス' }, { kana: 'せ', romaji: 'se', kata: 'セ' }, { kana: 'そ', romaji: 'so', kata: 'ソ' },
            { kana: 'た', romaji: 'ta', kata: 'タ' }, { kana: 'ち', romaji: 'chi', kata: 'チ' }, { kana: 'つ', romaji: 'tsu', kata: 'ツ' }, { kana: 'て', romaji: 'te', kata: 'テ' }, { kana: 'と', romaji: 'to', kata: 'ト' },
            { kana: 'な', romaji: 'na', kata: 'ナ' }, { kana: 'に', romaji: 'ni', kata: 'ニ' }, { kana: 'ぬ', romaji: 'nu', kata: 'ヌ' }, { kana: 'ね', romaji: 'ne', kata: 'ネ' }, { kana: 'の', romaji: 'no', kata: 'ノ' },
            { kana: 'は', romaji: 'ha', kata: 'ハ' }, { kana: 'ひ', romaji: 'hi', kata: 'ヒ' }, { kana: 'ふ', romaji: 'fu', kata: 'フ' }, { kana: 'へ', romaji: 'he', kata: 'ヘ' }, { kana: 'ほ', romaji: 'ho', kata: 'ホ' },
            { kana: 'ま', romaji: 'ma', kata: 'マ' }, { kana: 'み', romaji: 'mi', kata: 'ミ' }, { kana: 'む', romaji: 'mu', kata: 'ム' }, { kana: 'め', romaji: 'me', kata: 'メ' }, { kana: 'も', romaji: 'mo', kata: 'モ' },
            { kana: 'や', romaji: 'ya', kata: 'ヤ' }, { kana: 'ゆ', romaji: 'yu', kata: 'ユ' }, { kana: 'よ', romaji: 'yo', kata: 'ヨ' },
            { kana: 'ら', romaji: 'ra', kata: 'ラ' }, { kana: 'り', romaji: 'ri', kata: 'リ' }, { kana: 'る', romaji: 'ru', kata: 'ル' }, { kana: 'れ', romaji: 're', kata: 'レ' }, { kana: 'ろ', romaji: 'ro', kata: 'ロ' },
            { kana: 'わ', romaji: 'wa', kata: 'ワ' }, { kana: 'を', romaji: 'wo', kata: 'ヲ' }, { kana: 'ん', romaji: 'n', kata: 'ン' }
        ];

        const hHard = [
            { kana: 'が', romaji: 'ga', kata: 'ガ' }, { kana: 'ぎ', romaji: 'gi', kata: 'ギ' }, { kana: 'ぐ', romaji: 'gu', kata: 'グ' }, { kana: 'げ', romaji: 'ge', kata: 'ゲ' }, { kana: 'ご', romaji: 'go', kata: 'ゴ' },
            { kana: 'ざ', romaji: 'za', kata: 'ザ' }, { kana: 'じ', romaji: 'ji', kata: 'ジ' }, { kana: 'ず', romaji: 'zu', kata: 'ズ' }, { kana: 'ぜ', romaji: 'ze', kata: 'ゼ' }, { kana: 'ぞ', romaji: 'zo', kata: 'ゾ' },
            { kana: 'だ', romaji: 'da', kata: 'ダ' }, { kana: 'ぢ', romaji: 'ji', kata: 'ヂ' }, { kana: 'づ', romaji: 'zu', kata: 'ヅ' }, { kana: 'で', romaji: 'de', kata: 'デ' }, { kana: 'ど', romaji: 'do', kata: 'ド' },
            { kana: 'ば', romaji: 'ba', kata: 'バ' }, { kana: 'び', romaji: 'bi', kata: 'ビ' }, { kana: 'ぶ', romaji: 'bu', kata: 'ブ' }, { kana: 'べ', romaji: 'be', kata: 'ベ' }, { kana: 'ぼ', romaji: 'bo', kata: 'ボ' },
            { kana: 'ぱ', romaji: 'pa', kata: 'パ' }, { kana: 'ぴ', romaji: 'pi', kata: 'ピ' }, { kana: 'ぷ', romaji: 'pu', kata: 'プ' }, { kana: 'ぺ', romaji: 'pe', kata: 'ペ' }, { kana: 'ぽ', romaji: 'po', kata: 'ポ' },
            { kana: 'きゃ', romaji: 'kya', kata: 'キャ' }, { kana: 'きゅ', romaji: 'kyu', kata: 'キュ' }, { kana: 'きょ', romaji: 'kyo', kata: 'キョ' },
            { kana: 'しゃ', romaji: 'sha', kata: 'シャ' }, { kana: 'しゅ', romaji: 'shu', kata: 'シュ' }, { kana: 'しょ', romaji: 'sho', kata: 'ショ' },
            { kana: 'ちゃ', romaji: 'cha', kata: 'チャ' }, { kana: 'ちゅ', romaji: 'chu', kata: 'チュ' }, { kana: 'ちょ', romaji: 'cho', kata: 'チョ' },
            { kana: 'にゃ', romaji: 'nya', kata: 'ニャ' }, { kana: 'にゅ', romaji: 'nyu', kata: 'ニュ' }, { kana: 'にょ', romaji: 'nyo', kata: 'ニョ' },
            { kana: 'ひゃ', romaji: 'hya', kata: 'ヒャ' }, { kana: 'ひゅ', romaji: 'hyu', kata: 'ヒュ' }, { kana: 'ひょ', romaji: 'hyo', kata: 'ヒョ' },
            { kana: 'みゃ', romaji: 'mya', kata: 'ミャ' }, { kana: 'みゅ', romaji: 'myu', kata: 'ミュ' }, { kana: 'みょ', romaji: 'myo', kata: 'ミョ' },
            { kana: 'りゃ', romaji: 'rya', kata: 'リャ' }, { kana: 'りゅ', romaji: 'ryu', kata: 'リュ' }, { kana: 'りょ', romaji: 'ryo', kata: 'リョ' }
        ];

        const kEasy = hEasy.map(item => ({ kana: item.kata, romaji: item.romaji }));
        const kHard = hHard.map(item => ({ kana: item.kata, romaji: item.romaji }));

        const perfectMessages = [
            "10/10 PERFECT!! You are officially a Kana Master, Clara! 🌸✨ So proud of you! 🖤 - Ryuji",
            "100%!! Absolutely flawless! My girl is unstoppable! 🥰🎉 - Ryuji",
            "FULL MARKS!! You nailed even the hardest ones! Amazing job Clara! 💖 - Ryuji"
        ];

        const highMessages = [
            "So close to perfection! Great job Clara! You're mastering this so fast! 💖 - Ryuji",
            "Awesome score!! You're doing incredible, Clara! Keep going! 🖤 - Ryuji"
        ];

        const goodMessages = [
            "Good effort Clara! Practice makes perfect, and you're doing great! 💪✨ - Ryuji",
            "Nice try!! Keep practicing and you'll get 10/10 next time! 🖤 - Ryuji"
        ];

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        let isKatakana = false;
        let isHard = false;

        function getActiveData() {
            let easyData = isKatakana ? kEasy : hEasy;
            let hardData = isKatakana ? kHard : hHard;
            return isHard ? [...easyData, ...hardData] : easyData;
        }

        let flashcardData = shuffle(getActiveData());
        let quizData = [];
        let currentCardIndex = 0;
        let currentQuizIndex = 0;
        let score = 0;
        let isAnswering = false;

        const hiraganaBtn = document.getElementById('hiraganaBtn');
        const katakanaBtn = document.getElementById('katakanaBtn');
        const easyModeBtn = document.getElementById('easyModeBtn');
        const hardModeBtn = document.getElementById('hardModeBtn');

        hiraganaBtn.addEventListener('click', () => {
            isKatakana = false;
            hiraganaBtn.classList.add('active');
            katakanaBtn.classList.remove('active');
            resetAll();
        });

        katakanaBtn.addEventListener('click', () => {
            isKatakana = true;
            katakanaBtn.classList.add('active');
            hiraganaBtn.classList.remove('active');
            resetAll();
        });

        easyModeBtn.addEventListener('click', () => {
            isHard = false;
            easyModeBtn.classList.add('active');
            hardModeBtn.classList.remove('active');
            resetAll();
        });

        hardModeBtn.addEventListener('click', () => {
            isHard = true;
            hardModeBtn.classList.add('active');
            easyModeBtn.classList.remove('active');
            resetAll();
        });

        function resetAll() {
            flashcardData = shuffle(getActiveData());
            currentCardIndex = 0;
            updateCard();
            renderChart();
            if (!quizSection.classList.contains('hidden')) {
                startQuiz();
            }
        }

        // タブ切り替え処理
        const cardTabBtn = document.getElementById('cardTabBtn');
        const quizTabBtn = document.getElementById('quizTabBtn');
        const chartTabBtn = document.getElementById('chartTabBtn');
        const cardSection = document.getElementById('cardSection');
        const quizSection = document.getElementById('quizSection');
        const chartSection = document.getElementById('chartSection');

        function hideAllSections() {
            cardSection.classList.add('hidden');
            quizSection.classList.add('hidden');
            chartSection.classList.add('hidden');
            cardTabBtn.classList.remove('active');
            quizTabBtn.classList.remove('active');
            chartTabBtn.classList.remove('active');
        }

        cardTabBtn.addEventListener('click', () => {
            hideAllSections();
            cardTabBtn.classList.add('active');
            cardSection.classList.remove('hidden');
        });

        quizTabBtn.addEventListener('click', () => {
            hideAllSections();
            quizTabBtn.classList.add('active');
            quizSection.classList.remove('hidden');
            startQuiz();
        });

        chartTabBtn.addEventListener('click', () => {
            hideAllSections();
            chartTabBtn.classList.add('active');
            chartSection.classList.remove('hidden');
            renderChart();
        });

        function speakKana(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 1. フラッシュカード
        const flashcard = document.getElementById('flashcard');
        const cardWrapper = document.getElementById('cardWrapper');
        const cardChar = document.getElementById('cardChar');
        const cardRomaji = document.getElementById('cardRomaji');
        const cardCounter = document.getElementById('cardCounter');

        function updateCard() {
            flashcard.classList.remove('flipped');
            setTimeout(() => {
                const item = flashcardData[currentCardIndex];
                cardChar.innerText = item.kana;
                cardRomaji.innerText = item.romaji;
                cardCounter.innerText = `${currentCardIndex + 1} / ${flashcardData.length}`;
            }, 150);
        }

        cardWrapper.addEventListener('click', () => {
            flashcard.classList.toggle('flipped');
            speakKana(flashcardData[currentCardIndex].kana);
        });

        document.getElementById('prevCardBtn').addEventListener('click', () => {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                updateCard();
            }
        });

        document.getElementById('nextCardBtn').addEventListener('click', () => {
            if (currentCardIndex < flashcardData.length - 1) {
                currentCardIndex++;
                updateCard();
            } else {
                flashcardData = shuffle(getActiveData());
                currentCardIndex = 0;
                updateCard();
            }
        });

        // 2. クイズ
        const quizChar = document.getElementById('quizChar');
        const optionsGrid = document.getElementById('optionsGrid');
        const scoreBoard = document.getElementById('scoreBoard');
        const feedbackOverlay = document.getElementById('feedbackOverlay');
        const feedbackSymbol = document.getElementById('feedbackSymbol');
        const feedbackText = document.getElementById('feedbackText');

        function startQuiz() {
            const currentSet = getActiveData();
            quizData = shuffle(currentSet).slice(0, 10);
            currentQuizIndex = 0;
            score = 0;
            isAnswering = false;
            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            if (currentQuizIndex >= quizData.length) {
                let msgList = goodMessages;
                if (score === 10) msgList = perfectMessages;
                else if (score >= 7) msgList = highMessages;
                
                const finalMsg = msgList[Math.floor(Math.random() * msgList.length)];

                setTimeout(() => {
                    alert(`Quiz Finished! 🎉\nYour Score: ${score} / ${quizData.length}\n\n"${finalMsg}"`);
                    startQuiz();
                }, 300);
                return;
            }

            const currentSet = getActiveData();
            const currentItem = quizData[currentQuizIndex];
            quizChar.innerText = currentItem.kana;
            scoreBoard.innerText = `Score: ${score} / ${quizData.length}`;

            let options = [currentItem.romaji];
            while (options.length < 4) {
                const randomItem = currentSet[Math.floor(Math.random() * currentSet.length)];
                if (!options.includes(randomItem.romaji)) {
                    options.push(randomItem.romaji);
                }
            }
            options = shuffle(options);

            optionsGrid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.addEventListener('click', () => checkAnswer(opt, currentItem.romaji));
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if (isAnswering) return;
            isAnswering = true;

            speakKana(quizData[currentQuizIndex].kana);

            const isCorrect = selected === correct;
            if (isCorrect) {
                score++;
                feedbackSymbol.innerText = "⭕️";
                feedbackText.innerText = "Great!";
                feedbackOverlay.className = "feedback-overlay feedback-correct show";
            } else {
                feedbackSymbol.innerText = "❌";
                feedbackText.innerText = `Correct: ${correct}`;
                feedbackOverlay.className = "feedback-overlay feedback-wrong show";
            }

            setTimeout(() => {
                feedbackOverlay.className = "feedback-overlay";
                isAnswering = false;
                currentQuizIndex++;
                loadQuizQuestion();
            }, 850);
        }

        // 3. 一覧表（Chart）の描画処理
        const chartGrid = document.getElementById('chartGrid');
        function renderChart() {
            const currentSet = getActiveData();
            chartGrid.innerHTML = '';
            currentSet.forEach(item => {
                const div = document.createElement('div');
                div.className = 'chart-item';
                div.innerHTML = `
                    <div class="chart-main">${item.kana}</div>
                    <div class="chart-sub">${item.romaji}</div>
                `;
                div.addEventListener('click', () => speakKana(item.kana));
                chartGrid.appendChild(div);
            });
        }

        updateCard();
    </script>
</body>
</html>
