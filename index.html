<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiragana Practice for Clara 🌸</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(180deg, #ffe6eb 0%, #fff0f3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            overflow-x: hidden;
        }

        h1 {
            color: #ff4d6d;
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            color: #ff758f;
            font-size: 0.95rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: white;
            padding: 5px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.15);
        }

        .tab-btn {
            border: none;
            background: transparent;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            color: #ff758f;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #ff4d6d;
            color: white;
        }

        .content-card {
            background: white;
            width: 100%;
            max-width: 360px;
            border-radius: 25px;
            padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* フラッシュカード */
        .flashcard-wrapper {
            perspective: 1000px;
            width: 220px;
            height: 220px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid #ffccd5;
            background: #fff5f7;
        }

        .card-front .char {
            font-size: 5rem;
            color: #ff4d6d;
            font-weight: bold;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #ff4d6d;
            color: white;
            border-color: #ff4d6d;
        }

        .card-back .romaji {
            font-size: 3.5rem;
            font-weight: bold;
        }

        .card-nav {
            display: flex;
            gap: 15px;
            align-items: center;
            width: 100%;
            justify-content: center;
        }

        .nav-btn {
            background: #ff758f;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.1s ease;
        }

        .nav-btn:active {
            transform: scale(0.9);
        }

        /* クイズ部分 */
        .quiz-char {
            font-size: 4.5rem;
            color: #ff4d6d;
            font-weight: bold;
            margin-bottom: 20px;
            transition: transform 0.2s ease;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .option-btn {
            background: #fff5f7;
            border: 2px solid #ffccd5;
            color: #ff4d6d;
            padding: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:active {
            transform: scale(0.92);
        }

        .score-board {
            margin-top: 15px;
            font-size: 0.95rem;
            color: #ff758f;
            font-weight: bold;
        }

        /* ⭕️❌ オーバーレイアニメーション */
        .feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }

        .feedback-overlay.show {
            opacity: 1;
            transform: scale(1);
        }

        .feedback-correct {
            background: rgba(255, 230, 235, 0.92);
            color: #ff2a55;
        }

        .feedback-wrong {
            background: rgba(240, 240, 240, 0.92);
            color: #888;
        }

        .feedback-symbol {
            font-size: 6rem;
            font-weight: bold;
            line-height: 1;
        }

        .feedback-text {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <h1>Hiragana for Clara 🌸</h1>
    <div class="subtitle">Learn & Test with Ryuji 🖤</div>

    <div class="tab-container">
        <button class="tab-btn active" id="cardTabBtn">1. Flashcards 🎴</button>
        <button class="tab-btn" id="quizTabBtn">2. Quiz Mode ✏️</button>
    </div>

    <!-- フラッシュカード画面 -->
    <div id="cardSection" class="content-card">
        <div class="flashcard-wrapper" id="cardWrapper">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="char" id="cardChar">あ</div>
                    <span style="font-size: 0.8rem; color: #ff758f; margin-top: 10px;">Tap to flip 🔄</span>
                </div>
                <div class="card-face card-back">
                    <div class="romaji" id="cardRomaji">a</div>
                </div>
            </div>
        </div>
        <div class="card-nav">
            <button class="nav-btn" id="prevCardBtn">❮</button>
            <span id="cardCounter" style="color: #ff758f; font-weight: bold;">1 / 46</span>
            <button class="nav-btn" id="nextCardBtn">❯</button>
        </div>
    </div>

    <!-- クイズ画面 -->
    <div id="quizSection" class="content-card hidden">
        <div class="quiz-char" id="quizChar">あ</div>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="score-board" id="scoreBoard">Score: 0 / 10</div>

        <!-- 正解・不正解ポップアップ -->
        <div id="feedbackOverlay" class="feedback-overlay">
            <div class="feedback-symbol" id="feedbackSymbol">⭕️</div>
            <div class="feedback-text" id="feedbackText">Great!</div>
        </div>
    </div>

    <script>
        const allKanaData = [
            { kana: 'あ', romaji: 'a' }, { kana: 'い', romaji: 'i' }, { kana: 'う', romaji: 'u' }, { kana: 'え', romaji: 'e' }, { kana: 'お', romaji: 'o' },
            { kana: 'か', romaji: 'ka' }, { kana: 'き', romaji: 'ki' }, { kana: 'く', romaji: 'ku' }, { kana: 'け', romaji: 'ke' }, { kana: 'こ', romaji: 'ko' },
            { kana: 'さ', romaji: 'sa' }, { kana: 'し', romaji: 'shi' }, { kana: 'す', romaji: 'su' }, { kana: 'せ', romaji: 'se' }, { kana: 'そ', romaji: 'so' },
            { kana: 'た', romaji: 'ta' }, { kana: 'ち', romaji: 'chi' }, { kana: 'つ', romaji: 'tsu' }, { kana: 'て', romaji: 'te' }, { kana: 'と', romaji: 'to' },
            { kana: 'な', romaji: 'na' }, { kana: 'に', romaji: 'ni' }, { kana: 'ぬ', romaji: 'nu' }, { kana: 'ね', romaji: 'ne' }, { kana: 'の', romaji: 'no' },
            { kana: 'は', romaji: 'ha' }, { kana: 'ひ', romaji: 'hi' }, { kana: 'ふ', romaji: 'fu' }, { kana: 'へ', romaji: 'he' }, { kana: 'ほ', romaji: 'ho' },
            { kana: 'ま', romaji: 'ma' }, { kana: 'み', romaji: 'mi' }, { kana: 'む', romaji: 'mu' }, { kana: 'め', romaji: 'me' }, { kana: 'も', romaji: 'mo' },
            { kana: 'や', romaji: 'ya' }, { kana: 'ゆ', romaji: 'yu' }, { kana: 'よ', romaji: 'yo' },
            { kana: 'ら', romaji: 'ra' }, { kana: 'り', romaji: 'ri' }, { kana: 'る', romaji: 'ru' }, { kana: 'れ', romaji: 're' }, { kana: 'ろ', romaji: 'ro' },
            { kana: 'わ', romaji: 'wa' }, { kana: 'を', romaji: 'wo' }, { kana: 'ん', romaji: 'n' }
        ];

        // 10問終了後の褒めメッセージ（スコア別で大量用意！）
        const perfectMessages = [
            "10/10 PERFECT!! You are officially a Hiragana Genius, Clara! 🌸✨ So proud of you! 🖤 - Ryuji",
            "100%!! Absolutely flawless performance! My girl is unstoppable! 🥰🎉 - Ryuji",
            "FULL MARKS!! Are you sure you're not Japanese already?! Amazing job Clara! 💖 - Ryuji",
            "PERFECT SCORE! You deserve a big prize for this! Can't wait to celebrate with you! 🥂✨ - Ryuji"
        ];

        const highMessages = [
            "So close to perfection! Great job Clara! You're mastering this so fast! 💖 - Ryuji",
            "Awesome score!! You're doing incredible, Clara! Keep going! 🖤 - Ryuji",
            "Super impressive! Just a tiny step away from 10/10. Proud of you! 🌸 - Ryuji"
        ];

        const goodMessages = [
            "Good effort Clara! Practice makes perfect, and you're getting better every time! 💪✨ - Ryuji",
            "Nice try!! You're making solid progress. Let's do another round together! 💖 - Ryuji",
            "You got this, Clara! Every mistake is just a step closer to mastering it! 🖤 - Ryuji"
        ];

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        let flashcardData = shuffle(allKanaData);
        let quizData = [];
        let currentCardIndex = 0;
        let currentQuizIndex = 0;
        let score = 0;
        let isAnswering = false; // 連打防止フラグ

        const cardTabBtn = document.getElementById('cardTabBtn');
        const quizTabBtn = document.getElementById('quizTabBtn');
        const cardSection = document.getElementById('cardSection');
        const quizSection = document.getElementById('quizSection');

        cardTabBtn.addEventListener('click', () => {
            cardTabBtn.classList.add('active');
            quizTabBtn.classList.remove('active');
            cardSection.classList.remove('hidden');
            quizSection.classList.add('hidden');
        });

        quizTabBtn.addEventListener('click', () => {
            quizTabBtn.classList.add('active');
            cardTabBtn.classList.remove('active');
            quizSection.classList.remove('hidden');
            cardSection.classList.add('hidden');
            startQuiz();
        });

        function speakKana(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }
        }

        // フラッシュカード
        const flashcard = document.getElementById('flashcard');
        const cardWrapper = document.getElementById('cardWrapper');
        const cardChar = document.getElementById('cardChar');
        const cardRomaji = document.getElementById('cardRomaji');
        const cardCounter = document.getElementById('cardCounter');

        function updateCard() {
            flashcard.classList.remove('flipped');
            setTimeout(() => {
                const item = flashcardData[currentCardIndex];
                cardChar.innerText = item.kana;
                cardRomaji.innerText = item.romaji;
                cardCounter.innerText = `${currentCardIndex + 1} / ${flashcardData.length}`;
            }, 150);
        }

        cardWrapper.addEventListener('click', () => {
            flashcard.classList.toggle('flipped');
            speakKana(flashcardData[currentCardIndex].kana);
        });

        document.getElementById('prevCardBtn').addEventListener('click', () => {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                updateCard();
            }
        });

        document.getElementById('nextCardBtn').addEventListener('click', () => {
            if (currentCardIndex < flashcardData.length - 1) {
                currentCardIndex++;
                updateCard();
            } else {
                flashcardData = shuffle(allKanaData);
                currentCardIndex = 0;
                updateCard();
            }
        });

        // クイズ
        const quizChar = document.getElementById('quizChar');
        const optionsGrid = document.getElementById('optionsGrid');
        const scoreBoard = document.getElementById('scoreBoard');
        const feedbackOverlay = document.getElementById('feedbackOverlay');
        const feedbackSymbol = document.getElementById('feedbackSymbol');
        const feedbackText = document.getElementById('feedbackText');

        function startQuiz() {
            quizData = shuffle(allKanaData).slice(0, 10);
            currentQuizIndex = 0;
            score = 0;
            isAnswering = false;
            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            if (currentQuizIndex >= quizData.length) {
                // 結果表示メッセージ選出
                let msgList = goodMessages;
                if (score === 10) msgList = perfectMessages;
                else if (score >= 7) msgList = highMessages;
                
                const finalMsg = msgList[Math.floor(Math.random() * msgList.length)];

                setTimeout(() => {
                    alert(`Quiz Finished! 🎉\nYour Score: ${score} / ${quizData.length}\n\n"${finalMsg}"`);
                    startQuiz();
                }, 300);
                return;
            }

            const currentItem = quizData[currentQuizIndex];
            quizChar.innerText = currentItem.kana;
            scoreBoard.innerText = `Score: ${score} / ${quizData.length}`;

            let options = [currentItem.romaji];
            while (options.length < 4) {
                const randomItem = allKanaData[Math.floor(Math.random() * allKanaData.length)];
                if (!options.includes(randomItem.romaji)) {
                    options.push(randomItem.romaji);
                }
            }
            options = shuffle(options);

            optionsGrid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.addEventListener('click', () => checkAnswer(opt, currentItem.romaji));
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if (isAnswering) return;
            isAnswering = true;

            speakKana(quizData[currentQuizIndex].kana);

            const isCorrect = selected === correct;
            if (isCorrect) {
                score++;
                feedbackSymbol.innerText = "⭕️";
                feedbackText.innerText = "Great!";
                feedbackOverlay.className = "feedback-overlay feedback-correct show";
            } else {
                feedbackSymbol.innerText = "❌";
                feedbackText.innerText = `Correct: ${correct}`;
                feedbackOverlay.className = "feedback-overlay feedback-wrong show";
            }

            // 0.8秒後に次の問題へ
            setTimeout(() => {
                feedbackOverlay.className = "feedback-overlay";
                isAnswering = false;
                currentQuizIndex++;
                loadQuizQuestion();
            }, 850);
        }

        updateCard();
    </script>
</body>
</html>
