<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kana Practice for Clara 🌸</title>

    <!-- iPhoneホーム画面追加用の設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Kana 🌸">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23ffe6eb%22/><text y=%22.9em%22 font-size=%2280%22>🌸</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(180deg, #ffe6eb 0%, #fff0f3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            overflow-x: hidden;
        }

        h1 {
            color: #ff4d6d;
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            color: #ff758f;
            font-size: 0.95rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .toggle-group {
            display: flex;
            gap: 10px;
        }

        .mode-btn {
            border: 2px solid #ff758f;
            background: white;
            padding: 6px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #ff758f;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: #ff758f;
            color: white;
        }

        .script-btn {
            border: 2px solid #ff4d6d;
            background: white;
            padding: 6px 18px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #ff4d6d;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .script-btn.active {
            background: #ff4d6d;
            color: white;
        }

        .tab-container {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            background: white;
            padding: 5px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.15);
        }

        .tab-btn {
            border: none;
            background: transparent;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #ff758f;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #ff4d6d;
            color: white;
        }

        .content-card {
            background: white;
            width: 100%;
            max-width: 380px;
            border-radius: 25px;
            padding: 25px 15px;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .flashcard-wrapper {
            perspective: 1000px;
            width: 220px;
            height: 220px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid #ffccd5;
            background: #fff5f7;
        }

        .card-front .char {
            font-size: 4.5rem;
            color: #ff4d6d;
            font-weight: bold;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #ff4d6d;
            color: white;
            border-color: #ff4d6d;
        }

        .card-back .romaji {
            font-size: 3rem;
            font-weight: bold;
        }

        .card-nav {
            display: flex;
            gap: 15px;
            align-items: center;
            width: 100%;
            justify-content: center;
        }

        .nav-btn {
            background: #ff758f;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.1s ease;
        }

        .nav-btn:active {
            transform: scale(0.9);
        }

        .quiz-char {
            font-size: 4.5rem;
            color: #ff4d6d;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .option-btn {
            background: #fff5f7;
            border: 2px solid #ffccd5;
            color: #ff4d6d;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:active {
            transform: scale(0.92);
        }

        .score-board {
            margin-top: 15px;
            font-size: 0.95rem;
            color: #ff758f;
            font-weight: bold;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 100%;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .chart-item {
            background: #fff5f7;
            border: 1.5px solid #ffccd5;
            border-radius: 12px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .chart-item:active {
            background: #ffe6eb;
        }

        .chart-main {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff4d6d;
        }

        .chart-sub {
            font-size: 0.75rem;
            color: #ff758f;
            margin-top: 2px;
        }

        .feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }

        .feedback-overlay.show {
            opacity: 1;
            transform: scale(1);
        }

        .feedback-correct {
            background: rgba(255, 230, 235, 0.92);
            color: #ff2a55;
        }

        .feedback-wrong {
            background: rgba(240, 240, 240, 0.92);
            color: #888;
        }

        .feedback-symbol {
            font-size: 6rem;
            font-weight: bold;
            line-height: 1;
        }

        .feedback-text {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <h1>Japanese Kana for Clara 🌸</h1>
    <div class="subtitle">Learn & Test with Ryuji 🖤</div>

    <div class="controls-container">
        <div class="toggle-group">
            <button class="script-btn active" id="hiraganaBtn">Hiragana</button>
            <button class="script-btn" id="katakanaBtn">Katakana</button>
        </div>
        <div class="toggle-group">
            <button class="mode-btn active" id="easyModeBtn">Easy Mode</button>
            <button class="mode-btn" id="hardModeBtn">Hard Mode</button>
        </div>
    </div>

    <div class="tab-container">
        <button class="tab-btn active" id="cardTabBtn">Flashcards 🎴</button>
        <button class="tab-btn" id="quizTabBtn">Quiz Mode ✏️</button>
        <button class="tab-btn" id="chartTabBtn">Kana Chart 📊</button>
    </div>

    <div id="cardSection" class="content-card">
        <div class="flashcard-wrapper" id="cardWrapper">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="char" id="cardChar">あ</div>
                    <span style="font-size: 0.8rem; color: #ff758f; margin-top: 10px;">Tap to flip 🔄</span>
                </div>
                <div class="card-face card-back">
                    <div class="romaji" id="cardRomaji">a</div>
                </div>
            </div>
        </div>
        <div class="card-nav">
            <button class="nav-btn" id="prevCardBtn">❮</button>
            <span id="cardCounter" style="color: #ff758f; font-weight: bold;">1 / 46</span>
            <button class="nav-btn" id="nextCardBtn">❯</button>
        </div>
    </div>

    <div id="quizSection" class="content-card hidden">
        <div class="quiz-char" id="quizChar">あ</div>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="score-board" id="scoreBoard">Score: 0 / 10</div>

        <div id="feedbackOverlay" class="feedback-overlay">
            <div class="feedback-symbol" id="feedbackSymbol">⭕️</div>
            <div class="feedback-text" id="feedbackText">Great!</div>
        </div>
    </div>

    <div id="chartSection" class="content-card hidden">
        <div class="chart-grid" id="chartGrid"></div>
        <div style="font-size: 0.8rem; color: #ff758f; margin-top: 10px;">Tap any character to listen! 🔊</div>
    </div>

    <script>
        const hEasy = [
            { kana: 'あ', romaji: 'a' }, { kana: 'い', romaji: 'i' }, { kana: 'う', romaji: 'u' }, { kana: 'え', romaji: 'e' }, { kana: 'お', romaji: 'o' },
            { kana: 'か', romaji: 'ka' }, { kana: 'き', romaji: 'ki' }, { kana: 'く', romaji: 'ku' }, { kana: 'け', romaji: 'ke' }, { kana: 'こ', romaji: 'ko' },
            { kana: 'さ', romaji: 'sa' }, { kana: 'し', romaji: 'shi' }, { kana: 'す', romaji: 'su' }, { kana: 'せ', romaji: 'se' }, { kana: 'そ', romaji: 'so' },
            { kana: 'た', romaji: 'ta' }, { kana: 'ち', romaji: 'chi' }, { kana: 'つ', romaji: 'tsu' }, { kana: 'て', romaji: 'te' }, { kana: 'と', romaji: 'to' },
            { kana: 'な', romaji: 'na' }, { kana: 'に', romaji: 'ni' }, { kana: 'ぬ', romaji: 'nu' }, { kana: 'ね', romaji: 'ne' }, { kana: 'の', romaji: 'no' },
            { kana: 'は', romaji: 'ha' }, { kana: 'ひ', romaji: 'hi' }, { kana: 'ふ', romaji: 'fu' }, { kana: 'へ', romaji: 'he' }, { kana: 'ほ', romaji: 'ho' },
            { kana: 'ま', romaji: 'ma' }, { kana: 'み', romaji: 'mi' }, { kana: 'む', romaji: 'mu' }, { kana: 'め', romaji: 'me' }, { kana: 'も', romaji: 'mo' },
            { kana: 'や', romaji: 'ya' }, { kana: 'ゆ', romaji: 'yu' }, { kana: 'よ', romaji: 'yo' },
            { kana: 'ら', romaji: 'ra' }, { kana: 'り', romaji: 'ri' }, { kana: 'る', romaji: 'ru' }, { kana: 'れ', romaji: 're' }, { kana: 'ろ', romaji: 'ro' },
            { kana: 'わ', romaji: 'wa' }, { kana: 'を', romaji: 'wo' }, { kana: 'ん', romaji: 'n' }
        ];

        const hHard = [
            { kana: 'が', romaji: 'ga' }, { kana: 'ぎ', romaji: 'gi' }, { kana: 'ぐ', romaji: 'gu' }, { kana: 'げ', romaji: 'ge' }, { kana: 'ご', romaji: 'go' },
            { kana: 'ざ', romaji: 'za' }, { kana: 'じ', romaji: 'ji' }, { kana: 'ず', romaji: 'zu' }, { kana: 'ぜ', romaji: 'ze' }, { kana: 'ぞ', romaji: 'zo' },
            { kana: 'だ', romaji: 'da' }, { kana: 'ぢ', romaji: 'ji' }, { kana: 'づ', romaji: 'zu' }, { kana: 'で', romaji: 'de' }, { kana: 'ど', romaji: 'do' },
            { kana: 'ば', romaji: 'ba' }, { kana: 'び', romaji: 'bi' }, { kana: 'ぶ', romaji: 'bu' }, { kana: 'べ', romaji: 'be' }, { kana: 'ぼ', romaji: 'bo' },
            { kana: 'ぱ', romaji: 'pa' }, { kana: 'ぴ', romaji: 'pi' }, { kana: 'ぷ', romaji: 'pu' }, { kana: 'ぺ', romaji: 'pe' }, { kana: 'ぽ', romaji: 'po' },
            { kana: 'きゃ', romaji: 'kya' }, { kana: 'きゅ', romaji: 'kyu' }, { kana: 'きょ', romaji: 'kyo' },
            { kana: 'しゃ', romaji: 'sha' }, { kana: 'しゅ', romaji: 'shu' }, { kana: 'しょ', romaji: 'sho' },
            { kana: 'ちゃ', romaji: 'cha' }, { kana: 'ちゅ', romaji: 'chu' }, { kana: 'ちょ', romaji: 'cho' },
            { kana: 'にゃ', romaji: 'nya' }, { kana: 'にゅ', romaji: 'nyu' }, { kana: 'にょ', romaji: 'nyo' },
            { kana: 'ひゃ', romaji: 'hya' }, { kana: 'ひゅ', romaji: 'hyu' }, { kana: 'ひょ', romaji: 'hyo' },
            { kana: 'みゃ', romaji: 'mya' }, { kana: 'みゅ', romaji: 'myu' }, { kana: 'みょ', romaji: 'myo' },
            { kana: 'りゃ', romaji: 'rya' }, { kana: 'りゅ', romaji: 'ryu' }, { kana: 'りょ', romaji: 'ryo' }
        ];

        const kEasy = [
            { kana: 'ア', romaji: 'a' }, { kana: 'イ', romaji: 'i' }, { kana: 'ウ', romaji: 'u' }, { kana: 'エ', romaji: 'e' }, { kana: 'オ', romaji: 'o' },
            { kana: 'カ', romaji: 'ka' }, { kana: 'キ', romaji: 'ki' }, { kana: 'ク', romaji: 'ku' }, { kana: 'ケ', romaji: 'ke' }, { kana: 'コ', romaji: 'ko' },
            { kana: 'サ', romaji: 'sa' }, { kana: 'シ', romaji: 'shi' }, { kana: 'ス', romaji: 'su' }, { kana: 'セ', romaji: 'se' }, { kana: 'ソ', romaji: 'so' },
            { kana: 'タ', romaji: 'ta' }, { kana: 'チ', romaji: 'chi' }, { kana: 'ツ', romaji: 'tsu' }, { kana: 'テ', romaji: 'te' }, { kana: 'ト', romaji: 'to' },
            { kana: 'ナ', romaji: 'na' }, { kana: 'ニ', romaji: 'ni' }, { kana: 'ヌ', romaji: 'nu' }, { kana: 'ネ', romaji: 'ne' }, { kana: 'ノ', romaji: 'no' },
            { kana: 'ハ', romaji: 'ha' }, { kana: 'ヒ', romaji: 'hi' }, { kana: 'フ', romaji: 'fu' }, { kana: 'ヘ', romaji: 'he' }, { kana: 'ホ', romaji: 'ho' },
            { kana: 'マ', romaji: 'ma' }, { kana: 'ミ', romaji: 'mi' }, { kana: 'ム', romaji: 'mu' }, { kana: 'メ', romaji: 'me' }, { kana: 'モ', romaji: 'mo' },
            { kana: 'ヤ', romaji: 'ya' }, { kana: 'ユ', romaji: 'yu' }, { kana: 'ヨ', romaji: 'yo' },
            { kana: 'ラ', romaji: 'ra' }, { kana: 'リ', romaji: 'ri' }, { kana: 'ル', romaji: 'ru' }, { kana: 'レ', romaji: 're' }, { kana: 'ロ', romaji: 'ro' },
            { kana: 'ワ', romaji: 'wa' }, { kana: 'ヲ', romaji: 'wo' }, { kana: 'ン', romaji: 'n' }
        ];

        const kHard = [
            { kana: 'ガ', romaji: 'ga' }, { kana: 'ギ', romaji: 'gi' }, { kana: 'グ', romaji: 'gu' }, { kana: 'ゲ', romaji: 'ge' }, { kana: 'ゴ', romaji: 'go' },
            { kana: 'ザ', romaji: 'za' }, { kana: 'ジ', romaji: 'ji' }, { kana: 'ズ', romaji: 'zu' }, { kana: 'ゼ', romaji: 'ze' }, { kana: 'ゾ', romaji: 'zo' },
            { kana: 'ダ', romaji: 'da' }, { kana: 'ヂ', romaji: 'ji' }, { kana: 'ヅ', romaji: 'zu' }, { kana: 'デ', romaji: 'de' }, { kana: 'ド', romaji: 'do' },
            { kana: 'バ', romaji: 'ba' }, { kana: 'ビ', romaji: 'bi' }, { kana: 'ブ', romaji: 'bu' }, { kana: 'ベ', romaji: 'be' }, { kana: 'ボ', romaji: 'bo' },
            { kana: 'パ', romaji: 'pa' }, { kana: 'ピ', romaji: 'pi' }, { kana: 'プ', romaji: 'pu' }, { kana: 'ペ', romaji: 'pe' }, { kana: 'ポ', romaji: 'po' },
            { kana: 'キャ', romaji: 'kya' }, { kana: 'キュ', romaji: 'kyu' }, { kana: 'キョ', romaji: 'kyo' },
            { kana: 'シャ', romaji: 'sha' }, { kana: 'シュ', romaji: 'shu' }, { kana: 'ショ', romaji: 'sho' },
            { kana: 'チャ', romaji: 'cha' }, { kana: 'チュ', romaji: 'chu' }, { kana: 'チョ', romaji: 'cho' },
            { kana: 'ニャ', romaji: 'nya' }, { kana: 'ニュ', romaji: 'nyu' }, { kana: 'ニョ', romaji: 'nyo' },
            { kana: 'ヒャ', romaji: 'hya' }, { kana: 'ヒュ', romaji: 'hyu' }, { kana: 'ヒョ', romaji: 'hyo' },
            { kana: 'ミャ', romaji: 'mya' }, { kana: 'ミュ', romaji: 'myu' }, { kana: 'ミョ', romaji: 'myo' },
            { kana: 'リャ', romaji: 'rya' }, { kana: 'リュ', romaji: 'ryu' }, { kana: 'リョ', romaji: 'ryo' }
        ];

        const perfectMessages = [
            "10/10 PERFECT!! You are officially a Kana Master, Clara! 🌸✨ So proud of you! 🖤 - Ryuji",
            "100%!! Absolutely flawless! My girl is unstoppable! 🥰🎉 - Ryuji",
            "FULL MARKS!! You nailed even the hardest ones! Amazing job Clara! 💖 - Ryuji"
        ];

        const highMessages = [
            "So close to perfection! Great job Clara! You're mastering this so fast! 💖 - Ryuji",
            "Awesome score!! You're doing incredible, Clara! Keep going! 🖤 - Ryuji"
        ];

        const goodMessages = [
            "Good effort Clara! Practice makes perfect, and you're doing great! 💪✨ - Ryuji",
            "Nice try!! Keep practicing and you'll get 10/10 next time! 🖤 - Ryuji"
        ];

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        let isKatakana = false;
        let isHard = false;

        function getActiveData() {
            let easyData = isKatakana ? kEasy : hEasy;
            let hardData = isKatakana ? kHard : hHard;
            return isHard ? [...easyData, ...hardData] : easyData;
        }

        let flashcardData = shuffle(getActiveData());
        let quizData = [];
        let currentCardIndex = 0;
        let currentQuizIndex = 0;
        let score = 0;
        let isAnswering = false;

        const hiraganaBtn = document.getElementById('hiraganaBtn');
        const katakanaBtn = document.getElementById('katakanaBtn');
        const easyModeBtn = document.getElementById('easyModeBtn');
        const hardModeBtn = document.getElementById('hardModeBtn');

        hiraganaBtn.addEventListener('click', () => {
            isKatakana = false;
            hiraganaBtn.classList.add('active');
            katakanaBtn.classList.remove('active');
            resetAll();
        });

        katakanaBtn.addEventListener('click', () => {
            isKatakana = true;
            katakanaBtn.classList.add('active');
            hiraganaBtn.classList.remove('active');
            resetAll();
        });

        easyModeBtn.addEventListener('click', () => {
            isHard = false;
            easyModeBtn.classList.add('active');
            hardModeBtn.classList.remove('active');
            resetAll();
        });

        hardModeBtn.addEventListener('click', () => {
            isHard = true;
            hardModeBtn.classList.add('active');
            easyModeBtn.classList.remove('active');
            resetAll();
        });

        function resetAll() {
            flashcardData = shuffle(getActiveData());
            currentCardIndex = 0;
            updateCard();
            renderChart();
            if (!quizSection.classList.contains('hidden')) {
                startQuiz();
            }
        }

        const cardTabBtn = document.getElementById('cardTabBtn');
        const quizTabBtn = document.getElementById('quizTabBtn');
        const chartTabBtn = document.getElementById('chartTabBtn');
        const cardSection = document.getElementById('cardSection');
        const quizSection = document.getElementById('quizSection');
        const chartSection = document.getElementById('chartSection');

        function hideAllSections() {
            cardSection.classList.add('hidden');
            quizSection.classList.add('hidden');
            chartSection.classList.add('hidden');
            cardTabBtn.classList.remove('active');
            quizTabBtn.classList.remove('active');
            chartTabBtn.classList.remove('active');
        }

        cardTabBtn.addEventListener('click', () => {
            hideAllSections();
            cardTabBtn.classList.add('active');
            cardSection.classList.remove('hidden');
        });

        quizTabBtn.addEventListener('click', () => {
            hideAllSections();
            quizTabBtn.classList.add('active');
            quizSection.classList.remove('hidden');
            startQuiz();
        });

        chartTabBtn.addEventListener('click', () => {
            hideAllSections();
            chartTabBtn.classList.add('active');
            chartSection.classList.remove('hidden');
            renderChart();
        });

        function speakKana(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }
        }

        const flashcard = document.getElementById('flashcard');
        const cardWrapper = document.getElementById('cardWrapper');
        const cardChar = document.getElementById('cardChar');
        const cardRomaji = document.getElementById('cardRomaji');
        const cardCounter = document.getElementById('cardCounter');

        function updateCard() {
            flashcard.classList.remove('flipped');
            setTimeout(() => {
                const item = flashcardData[currentCardIndex];
                cardChar.innerText = item.kana;
                cardRomaji.innerText = item.romaji;
                cardCounter.innerText = `${currentCardIndex + 1} / ${flashcardData.length}`;
            }, 150);
        }

        cardWrapper.addEventListener('click', () => {
            flashcard.classList.toggle('flipped');
            speakKana(flashcardData[currentCardIndex].kana);
        });

        document.getElementById('prevCardBtn').addEventListener('click', () => {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                updateCard();
            }
        });

        document.getElementById('nextCardBtn').addEventListener('click', () => {
            if (currentCardIndex < flashcardData.length - 1) {
                currentCardIndex++;
                updateCard();
            } else {
                flashcardData = shuffle(getActiveData());
                currentCardIndex = 0;
                updateCard();
            }
        });

        const quizChar = document.getElementById('quizChar');
        const optionsGrid = document.getElementById('optionsGrid');
        const scoreBoard = document.getElementById('scoreBoard');
        const feedbackOverlay = document.getElementById('feedbackOverlay');
        const feedbackSymbol = document.getElementById('feedbackSymbol');
        const feedbackText = document.getElementById('feedbackText');

        function startQuiz() {
            const currentSet = getActiveData();
            quizData = shuffle(currentSet).slice(0, 10);
            currentQuizIndex = 0;
            score = 0;
            isAnswering = false;
            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            if (currentQuizIndex >= quizData.length) {
                let msgList = goodMessages;
                if (score === 10) msgList = perfectMessages;
                else if (score >= 7) msgList = highMessages;
                
                const finalMsg = msgList[Math.floor(Math.random() * msgList.length)];

                setTimeout(() => {
                    alert(`Quiz Finished! 🎉\nYour Score: ${score} / ${quizData.length}\n\n"${finalMsg}"`);
                    startQuiz();
                }, 300);
                return;
            }

            const currentSet = getActiveData();
            const currentItem = quizData[currentQuizIndex];
            quizChar.innerText = currentItem.kana;
            scoreBoard.innerText = `Score: ${score} / ${quizData.length}`;

            let options = [currentItem.romaji];
            while (options.length < 4) {
                const randomItem = currentSet[Math.floor(Math.random() * currentSet.length)];
                if (!options.includes(randomItem.romaji)) {
                    options.push(randomItem.romaji);
                }
            }
            options = shuffle(options);

            optionsGrid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.addEventListener('click', () => checkAnswer(opt, currentItem.romaji));
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if (isAnswering) return;
            isAnswering = true;

            speakKana(quizData[currentQuizIndex].kana);

            const isCorrect = selected === correct;
            if (isCorrect) {
                score++;
                feedbackSymbol.innerText = "⭕️";
                feedbackText.innerText = "Great!";
                feedbackOverlay.className = "feedback-overlay feedback-correct show";
            } else {
                feedbackSymbol.innerText = "❌";
                feedbackText.innerText = `Correct: ${correct}`;
                feedbackOverlay.className = "feedback-overlay feedback-wrong show";
            }

            setTimeout(() => {
                feedbackOverlay.className = "feedback-overlay";
                isAnswering = false;
                currentQuizIndex++;
                loadQuizQuestion();
            }, 850);
        }

        const chartGrid = document.getElementById('chartGrid');
        function renderChart() {
            const currentSet = getActiveData();
            chartGrid.innerHTML = '';
            currentSet.forEach(item => {
                const div = document.createElement('div');
                div.className = 'chart-item';
                div.innerHTML = `
                    <div class="chart-main">${item.kana}</div>
                    <div class="chart-sub">${item.romaji}</div>
                `;
                div.addEventListener('click', () => speakKana(item.kana));
                chartGrid.appendChild(div);
            });
        }

        updateCard();
    </script>
</body>
</html>
