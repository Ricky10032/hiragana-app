<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kana Practice for Clara 🌸</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Kana 🌸">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23f3e8ff%22/><text y=%22.9em%22 font-size=%2280%22>🌸</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #ffe6eb 0%, #f3e8ff 50%, #e0e7ff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            overflow-x: hidden;
            position: relative;
        }

        /* 🌸 サイドエリアの賑やかマスコット（左右の空白活用） */
        .side-mascot {
            position: fixed;
            bottom: 20px;
            width: 80px;
            height: 80px;
            z-index: 10;
            pointer-events: auto;
            cursor: pointer;
            filter: drop-shadow(0 4px 10px rgba(168, 85, 247, 0.25));
            transition: transform 0.2s ease;
        }

        .side-mascot-left {
            left: 15px;
            animation: floatLeft 3.5s ease-in-out infinite;
        }

        .side-mascot-right {
            right: 15px;
            animation: bounceRight 2.5s ease-in-out infinite;
        }

        .side-mascot:active {
            transform: scale(1.2) rotate(10deg);
        }

        @keyframes floatLeft {
            0%, 100% { transform: translateY(0px) rotate(-3deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }

        @keyframes bounceRight {
            0%, 100% { transform: translateY(0px) scale(1, 1); }
            50% { transform: translateY(-12px) scale(1.05, 0.95); }
        }

        /* 🌸 ヘッダーエリア */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 5px;
            position: relative;
        }

        /* 五条先生浮遊 */
        .gojo-avatar {
            width: 65px;
            height: 65px;
            animation: floatGojo 3s ease-in-out infinite;
            filter: drop-shadow(0 5px 10px rgba(168, 85, 247, 0.3));
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .gojo-avatar:active {
            transform: scale(1.15) rotate(5deg);
        }

        @keyframes floatGojo {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }

        .gojo-avatar.domain-active {
            animation: domainExpansion 0.8s ease-in-out infinite alternate;
        }

        @keyframes domainExpansion {
            0% { filter: drop-shadow(0 0 12px #c084fc) drop-shadow(0 0 25px #f472b6); transform: scale(1.05); }
            100% { filter: drop-shadow(0 0 20px #e879f9) drop-shadow(0 0 35px #818cf8); transform: scale(1.15); }
        }

        /* リムル様プルプル */
        .rimuru-avatar {
            width: 60px;
            height: 55px;
            animation: rimuruBounce 2s ease-in-out infinite;
            filter: drop-shadow(0 5px 10px rgba(56, 189, 248, 0.35));
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .rimuru-avatar:active {
            transform: scale(0.85, 1.25);
        }

        @keyframes rimuruBounce {
            0%, 100% { transform: translateY(0px) scale(1, 1); }
            50% { transform: translateY(-6px) scale(1.08, 0.92); }
        }

        .rimuru-avatar.jump-active {
            animation: rimuruSuperJump 0.6s ease-in-out infinite alternate;
        }

        @keyframes rimuruSuperJump {
            0% { transform: translateY(0px) scale(1, 1); }
            100% { transform: translateY(-18px) scale(1.15, 0.85); filter: drop-shadow(0 0 15px #38bdf8); }
        }

        h1 {
            color: #b45309;
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.7rem;
            margin: 0;
            text-align: center;
            font-weight: 800;
        }

        .subtitle {
            color: #a855f7;
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .toggle-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-btn {
            border: 2px solid #c084fc;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #a855f7;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(168, 85, 247, 0.15);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #c084fc, #a855f7);
            color: white;
            border-color: #a855f7;
        }

        .script-btn {
            border: 2px solid #f472b6;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #ec4899;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(236, 72, 153, 0.15);
        }

        .script-btn.active {
            background: linear-gradient(135deg, #f472b6, #ec4899);
            color: white;
            border-color: #ec4899;
        }

        .tab-container {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            padding: 5px;
            border-radius: 30px;
            box-shadow: 0 4px 18px rgba(168, 85, 247, 0.2);
        }

        .tab-btn {
            border: none;
            background: transparent;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #a855f7;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ec4899, #a855f7);
            color: white;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 380px;
            border-radius: 25px;
            padding: 25px 15px;
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.2);
            border: 2px solid rgba(244, 114, 182, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .flashcard-wrapper {
            perspective: 1000px;
            width: 250px;
            height: 220px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid #f472b6;
            background: linear-gradient(180deg, #ffffff 0%, #fef2f2 100%);
            padding: 10px;
        }

        .card-front .char {
            font-size: 3.2rem;
            color: #ec4899;
            font-weight: bold;
            text-align: center;
            word-break: break-all;
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #ec4899 0%, #a855f7 100%);
            color: white;
            border-color: #a855f7;
        }

        .card-back .romaji {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
        }

        .card-back .meaning {
            font-size: 1.1rem;
            margin-top: 8px;
            opacity: 0.95;
            text-align: center;
        }

        .card-nav {
            display: flex;
            gap: 15px;
            align-items: center;
            width: 100%;
            justify-content: center;
        }

        .nav-btn {
            background: linear-gradient(135deg, #f472b6, #a855f7);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
            transition: transform 0.1s ease;
        }

        .nav-btn:active {
            transform: scale(0.9);
        }

        .quiz-char {
            font-size: 3.2rem;
            color: #ec4899;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            word-break: break-all;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .option-btn {
            background: #faf5ff;
            border: 2px solid #e9d5ff;
            color: #a855f7;
            padding: 14px 6px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            word-break: break-word;
        }

        .option-btn:active {
            transform: scale(0.92);
        }

        .score-board {
            margin-top: 15px;
            font-size: 0.95rem;
            color: #a855f7;
            font-weight: bold;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .chart-item {
            background: #faf5ff;
            border: 1.5px solid #e9d5ff;
            border-radius: 12px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .chart-item:active {
            background: #f3e8ff;
        }

        .chart-main {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ec4899;
            text-align: center;
            word-break: break-all;
        }

        .chart-sub {
            font-size: 0.7rem;
            color: #a855f7;
            margin-top: 2px;
            text-align: center;
            word-break: break-all;
        }

        .feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }

        .feedback-overlay.show {
            opacity: 1;
            transform: scale(1);
        }

        .feedback-correct {
            background: rgba(243, 232, 255, 0.95);
            color: #a855f7;
        }

        .feedback-wrong {
            background: rgba(240, 240, 240, 0.95);
            color: #888;
        }

        .feedback-symbol {
            font-size: 6rem;
            font-weight: bold;
            line-height: 1;
        }

        .feedback-text {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
            padding: 0 10px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .side-mascot {
                width: 55px;
                height: 55px;
                bottom: 10px;
            }
            .side-mascot-left { left: 5px; }
            .side-mascot-right { right: 5px; }
        }
    </style>
</head>
<body>

    <!-- 🌸 左サイドマスコット（リムル様ミニ） -->
    <svg class="side-mascot side-mascot-left" viewBox="0 0 100 80">
        <path d="M 10 50 Q 5 15 50 15 Q 95 15 90 50 Q 95 75 50 75 Q 5 75 10 50 Z" fill="#38bdf8" opacity="0.9"/>
        <ellipse cx="35" cy="45" rx="4" ry="7" fill="#0369a1"/>
        <ellipse cx="65" cy="45" rx="4" ry="7" fill="#0369a1"/>

    <svg class="side-mascot side-mascot-right" viewBox="0 0 100 100">

    <!-- 🌸 メインヘッダー -->
    <div class="header-container">
        <!-- ちび五条先生 -->
        <svg class="gojo-avatar" id="gojoAvatar" viewBox="0 0 100 100">
            <path d="M 20 45 Q 15 15 50 10 Q 85 15 80 45 Z" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>

            <circle cx="32" cy="60" r="4" fill="#fbcfe8"/>

        <div>
            <h1>Kana for Clara 🌸</h1>
            <div class="subtitle">Gojo & Rimuru & Ryuji's Class 💙</div>
        </div>

        <!-- 転スラ リムル様（スライム形態） -->
        <svg class="rimuru-avatar" id="rimuruAvatar" viewBox="0 0 100 80">
            <path d="M 10 50 Q 5 15 50 15 Q 95 15 90 50 Q 95 75 50 75 Q 5 75 10 50 Z" fill="#38bdf8" opacity="0.95"/>
            <ellipse cx="35" cy="45" rx="5" ry="8" fill="#0369a1"/>
            <ellipse cx="65" cy="45" rx="5" ry="8" fill="#0369a1"/>
            <circle cx="37" cy="42" r="2" fill="#ffffff"/>

            <circle cx="22" cy="52" r="5" fill="#7dd3fc" opacity="0.6"/>
            <circle cx="78" cy="52" r="5" fill="#7dd3fc" opacity="0.6"/>
        </svg>
    </div>

    <div class="controls-container">
        <div class="toggle-group">
            <button class="script-btn active" id="hiraganaBtn">Hiragana</button>
            <button class="script-btn" id="katakanaBtn">Katakana</button>
        </div>
        <div class="toggle-group">
            <button class="mode-btn active" id="easyModeBtn">Easy</button>
            <button class="mode-btn" id="hardModeBtn">Hard</button>
            <button class="mode-btn" id="wordsModeBtn">Words (100) 🌸</button>
        </div>
    </div>

    <div class="tab-container">
        <button class="tab-btn active" id="cardTabBtn">Flashcards 🎴</button>
        <button class="tab-btn" id="quizTabBtn">Quiz Mode ✏️</button>
        <button class="tab-btn" id="chartTabBtn">Kana Chart 📊</button>
    </div>

    <div id="cardSection" class="content-card">
        <div class="flashcard-wrapper" id="cardWrapper">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="char" id="cardChar">あ</div>
                    <span style="font-size: 0.8rem; color: #a855f7; margin-top: 10px;">Tap to flip 🔄</span>
                </div>
                <div class="card-face card-back">
                    <div class="romaji" id="cardRomaji">a</div>
                    <div class="meaning" id="cardMeaning"></div>
                </div>
            </div>
        </div>
        <div class="card-nav">
            <button class="nav-btn" id="prevCardBtn">❮</button>
            <span id="cardCounter" style="color: #a855f7; font-weight: bold;">1 / 46</span>
            <button class="nav-btn" id="nextCardBtn">❯</button>
        </div>
    </div>

    <div id="quizSection" class="content-card hidden">
        <div class="quiz-char" id="quizChar">あ</div>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="score-board" id="scoreBoard">Score: 0 / 10</div>

        <div id="feedbackOverlay" class="feedback-overlay">
            <div class="feedback-symbol" id="feedbackSymbol">⭕️</div>
            <div class="feedback-text" id="feedbackText">Great!</div>
        </div>
    </div>

    <div id="chartSection" class="content-card hidden">
        <div class="chart-grid" id="chartGrid"></div>
        <div style="font-size: 0.8rem; color: #a855f7; margin-top: 10px;">Tap any character/word to listen! 🔊</div>
    </div>

    <script>
        const hEasy = [
            { kana: 'あ', romaji: 'a' }, { kana: 'い', romaji: 'i' }, { kana: 'う', romaji: 'u' }, { kana: 'え', romaji: 'e' }, { kana: 'お', romaji: 'o' },
            { kana: 'か', romaji: 'ka' }, { kana: 'き', romaji: 'ki' }, { kana: 'く', romaji: 'ku' }, { kana: 'け', romaji: 'ke' }, { kana: 'こ', romaji: 'ko' },
            { kana: 'さ', romaji: 'sa' }, { kana: 'し', romaji: 'shi' }, { kana: 'す', romaji: 'su' }, { kana: 'せ', romaji: 'se' }, { kana: 'そ', romaji: 'so' },
            { kana: 'た', romaji: 'ta' }, { kana: 'ち', romaji: 'chi' }, { kana: 'つ', romaji: 'tsu' }, { kana: 'て', romaji: 'te' }, { kana: 'と', romaji: 'to' },

            { kana: 'ま', romaji: 'ma' }, { kana: 'み', romaji: 'mi' }, { kana: 'む', romaji: 'mu' }, { kana: 'め', romaji: 'me' }, { kana: 'も', romaji: 'mo' },
            { kana: 'や', romaji: 'ya' }, { kana: 'ゆ', romaji: 'yu' }, { kana: 'よ', romaji: 'yo' },
            { kana: 'ら', romaji: 'ra' }, { kana: 'り', romaji: 'ri' }, { kana: 'る', romaji: 'ru' }, { kana: 'れ', romaji: 're' }, { kana: 'ろ', romaji: 'ro' },
            { kana: 'わ', romaji: 'wa' }, { kana: 'を', romaji: 'wo' }, { kana: 'ん', romaji: 'n' }
        ];

        const hHard = [
            { kana: 'が', romaji: 'ga' }, { kana: 'ぎ', romaji: 'gi' }, { kana: 'ぐ', romaji: 'gu' }, { kana: 'げ', romaji: 'ge' }, { kana: 'ご', romaji: 'go' },
            { kana: 'ざ', romaji: 'za' }, { kana: 'じ', romaji: 'ji' }, { kana: 'ず', romaji: 'zu' }, { kana: 'ぜ', romaji: 'ze' }, { kana: 'ぞ', romaji: 'zo' },

            { kana: 'ば', romaji: 'ba' }, { kana: 'び', romaji: 'bi' }, { kana: 'ぶ', romaji: 'bu' }, { kana: 'べ', romaji: 'be' }, { kana: 'ぼ', romaji: 'bo' },
            { kana: 'ぱ', romaji: 'pa' }, { kana: 'ぴ', romaji: 'pi' }, { kana: 'ぷ', romaji: 'pu' }, { kana: 'ぺ', romaji: 'pe' }, { kana: 'ぽ', romaji: 'po' },
            { kana: 'きゃ', romaji: 'kya' }, { kana: 'きゅ', romaji: 'kyu' }, { kana: 'きょ', romaji: 'kyo' },
            { kana: 'しゃ', romaji: 'sha' }, { kana: 'しゅ', romaji: 'shu' }, { kana: 'しょ', romaji: 'sho' },
            { kana: 'ちゃ', romaji: 'cha' }, { kana: 'ちゅ', romaji: 'chu' }, { kana: 'ちょ', romaji: 'cho' },
            { kana: 'にゃ', romaji: 'nya' }, { kana: 'にゅ', romaji: 'nyu' }, { kana: 'にょ', romaji: 'nyo' },

        const hardModeBtn = document.getElementById('hardModeBtn');
        const wordsModeBtn = document.getElementById('wordsModeBtn');
        const gojoAvatar = document.getElementById('gojoAvatar');
        const rimuruAvatar = document.getElementById('rimuruAvatar');

        // 五条先生タップアクション（ボイスなし・輝き演出のみ）
        gojoAvatar.addEventListener('click', () => {
            gojoAvatar.classList.add('domain-active');
            setTimeout(() => gojoAvatar.classList.remove('domain-active'), 2000);
        });

        // リムル様タップアクション（跳ねるアクション）
        rimuruAvatar.addEventListener('click', () => {
            rimuruAvatar.classList.add('jump-active');
            setTimeout(() => rimuruAvatar.classList.remove('jump-active'), 1500);
        });

        hiraganaBtn.addEventListener('click', () => {
            isKatakana = false;
            hiraganaBtn.classList.add('active');
            katakanaBtn.classList.remove('active');
            resetAll();
        });

        katakanaBtn.addEventListener('click', () => {
            isKatakana = true;
            katakanaBtn.classList.add('active');
            hiraganaBtn.classList.remove('active');
            resetAll();
        });

        easyModeBtn.addEventListener('click', () => {
            mode = 'easy';
            updateModeButtons();
            resetAll();
        });

        hardModeBtn.addEventListener('click', () => {
            mode = 'hard';
            updateModeButtons();
            resetAll();
        });

        wordsModeBtn.addEventListener('click', () => {
            mode = 'words';
            updateModeButtons();
            resetAll();
        });

        function updateModeButtons() {
            easyModeBtn.classList.toggle('active', mode === 'easy');
            hardModeBtn.classList.toggle('active', mode === 'hard');
            wordsModeBtn.classList.toggle('active', mode === 'words');
        }

        function resetAll() {
            flashcardData = shuffle(getActiveData());
            currentCardIndex = 0;
            updateCard();
            renderChart();
            if (!quizSection.classList.contains('hidden')) {
                startQuiz();
            }
        }

        const cardTabBtn = document.getElementById('cardTabBtn');
        const quizTabBtn = document.getElementById('quizTabBtn');
        const chartTabBtn = document.getElementById('chartTabBtn');
        const cardSection = document.getElementById('cardSection');
        const quizSection = document.getElementById('quizSection');
        const chartSection = document.getElementById('chartSection');

        function hideAllSections() {
            cardSection.classList.add('hidden');
            quizSection.classList.add('hidden');
            chartSection.classList.add('hidden');
            cardTabBtn.classList.remove('active');
            quizTabBtn.classList.remove('active');
            chartTabBtn.classList.remove('active');
        }

        cardTabBtn.addEventListener('click', () => {
            hideAllSections();
            cardTabBtn.classList.add('active');
            cardSection.classList.remove('hidden');
        });

        quizTabBtn.addEventListener('click', () => {
            hideAllSections();
            quizTabBtn.classList.add('active');
            quizSection.classList.remove('hidden');
            startQuiz();
        });

        chartTabBtn.addEventListener('click', () => {
            hideAllSections();
            chartTabBtn.classList.add('active');
            chartSection.classList.remove('hidden');
            renderChart();
        });

        function speakKana(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';

                const voices = window.speechSynthesis.getVoices();
                const cuteVoice = voices.find(v => 
                    v.lang.includes('ja') && (
                        v.name.includes('Kyoko') || 
                        v.name.includes('Google') || 
                        v.name.includes('Natural') || 
                        v.name.includes('Otoya') ||
                        v.name.includes('Siri')
                    )
                ) || voices.find(v => v.lang.includes('ja'));

                if (cuteVoice) {
                    utterance.voice = cuteVoice;
                }

                utterance.pitch = 1.25;
                utterance.rate = 0.85;

                window.speechSynthesis.speak(utterance);
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        const flashcard = document.getElementById('flashcard');
        const cardWrapper = document.getElementById('cardWrapper');
        const cardChar = document.getElementById('cardChar');
        const cardRomaji = document.getElementById('cardRomaji');
        const cardMeaning = document.getElementById('cardMeaning');
        const cardCounter = document.getElementById('cardCounter');

        function updateCard() {
            flashcard.classList.remove('flipped');
            setTimeout(() => {
                const item = flashcardData[currentCardIndex];
                cardChar.innerText = item.kana;
                cardRomaji.innerText = item.romaji;
                cardMeaning.innerText = item.meaning || '';
                cardCounter.innerText = `${currentCardIndex + 1} / ${flashcardData.length}`;
            }, 150);
        }

        cardWrapper.addEventListener('click', () => {
            flashcard.classList.toggle('flipped');
            speakKana(flashcardData[currentCardIndex].kana);
        });

        document.getElementById('prevCardBtn').addEventListener('click', () => {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                updateCard();
            }
        });

        document.getElementById('nextCardBtn').addEventListener('click', () => {
            if (currentCardIndex < flashcardData.length - 1) {
                currentCardIndex++;
                updateCard();
            } else {
                flashcardData = shuffle(getActiveData());
                currentCardIndex = 0;
                updateCard();
            }
        });

        const quizChar = document.getElementById('quizChar');
        const optionsGrid = document.getElementById('optionsGrid');
        const scoreBoard = document.getElementById('scoreBoard');
        const feedbackOverlay = document.getElementById('feedbackOverlay');
        const feedbackSymbol = document.getElementById('feedbackSymbol');
        const feedbackText = document.getElementById('feedbackText');

        function startQuiz() {
            const currentSet = getActiveData();
            quizData = shuffle(currentSet).slice(0, Math.min(10, currentSet.length));
            currentQuizIndex = 0;
            score = 0;
            isAnswering = false;
            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            if (currentQuizIndex >= quizData.length) {
                let msgList = goodMessages;
                if (score === quizData.length) {
                    msgList = perfectMessages;
                    gojoAvatar.classList.add('domain-active');
                    rimuruAvatar.classList.add('jump-active');
                    setTimeout(() => {
                        gojoAvatar.classList.remove('domain-active');
                        rimuruAvatar.classList.remove('jump-active');
                    }, 4000);
                } else if (score >= Math.floor(quizData.length * 0.7)) {
                    msgList = highMessages;
                }
                
                const finalMsg = msgList[Math.floor(Math.random() * msgList.length)];

                setTimeout(() => {
                    alert(`Quiz Finished! 🎉\nYour Score: ${score} / ${quizData.length}\n\n"${finalMsg}"`);
                    startQuiz();
                }, 300);
                return;
            }

            const currentSet = getActiveData();
            const currentItem = quizData[currentQuizIndex];
            quizChar.innerText = currentItem.kana;
            scoreBoard.innerText = `Score: ${score} / ${quizData.length}`;

            const correctVal = (mode === 'words' && currentItem.meaning) ? currentItem.meaning : currentItem.romaji;

            let options = [correctVal];
            while (options.length < 4 && options.length < currentSet.length) {
                const randomItem = currentSet[Math.floor(Math.random() * currentSet.length)];
                const val = (mode === 'words' && randomItem.meaning) ? randomItem.meaning : randomItem.romaji;
                if (!options.includes(val)) {
                    options.push(val);
                }
            }
            options = shuffle(options);

            optionsGrid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.addEventListener('click', () => checkAnswer(opt, correctVal));
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if (isAnswering) return;
            isAnswering = true;

            speakKana(quizData[currentQuizIndex].kana);

            const isCorrect = selected === correct;
            if (isCorrect) {
                score++;
                feedbackSymbol.innerText = "⭕️";
                feedbackText.innerText = "Great!";
                feedbackOverlay.className = "feedback-overlay feedback-correct show";
            } else {
                feedbackSymbol.innerText = "❌";
                feedbackText.innerText = `Correct: ${correct}`;
                feedbackOverlay.className = "feedback-overlay feedback-wrong show";
            }

            setTimeout(() => {
                feedbackOverlay.className = "feedback-overlay";
                isAnswering = false;
                currentQuizIndex++;
                loadQuizQuestion();
            }, 850);
        }

        const chartGrid = document.getElementById('chartGrid');
        function renderChart() {
            const currentSet = getActiveData();
            chartGrid.innerHTML = '';
            
            if (mode === 'words') {
                chartGrid.style.gridTemplateColumns = 'repeat(2, 1fr)';
            } else {
                chartGrid.style.gridTemplateColumns = 'repeat(4, 1fr)';
            }

            currentSet.forEach(item => {
                const div = document.createElement('div');
                div.className = 'chart-item';
                div.innerHTML = `
                    <div class="chart-main">${item.kana}</div>
                    <div class="chart-sub">${item.romaji} ${item.meaning ? `<br>(${item.meaning})` : ''}</div>
                `;
                div.addEventListener('click', () => speakKana(item.kana));
                chartGrid.appendChild(div);
            });
        }

        updateCard();
    </script>
</body>
</html>
